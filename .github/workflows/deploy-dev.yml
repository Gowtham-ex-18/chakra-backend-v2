name: Deploy NestJS Backend to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nestjs-hostinger-staging
  cancel-in-progress: false

env:
  PM2_APP_NAME: chakra-dev-backend   # change to your PM2 app name
  HOST: ${{ secrets.HOSTINGER_HOST }}
  USER: ${{ secrets.HOSTINGER_USER }}
  PORT: ${{ vars.HOSTINGER_PORT }}
  APP_DIR: ${{ vars.HOSTINGER_APP_DIR }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install and Build
        run: |
          npm ci
          npm run build
          test -f dist/main.js
          tar -czf /tmp/app.tar.gz dist package.json package-lock.json

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host hostinger
            HostName $HOST
            Port $PORT
            User $USER
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking yes
          EOF
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts ~/.ssh/config

      - name: Upload Application
        run: |
          ssh hostinger "mkdir -p '$APP_DIR/releases'"
          scp /tmp/app.tar.gz "hostinger:$APP_DIR/deploy.tar.gz"

      - name: Deploy and Restart PM2
        run: |
          ssh hostinger "bash -s -- '$APP_DIR' '$PM2_APP_NAME'" <<'REMOTE'
          set -euo pipefail
          [ -s "$HOME/.nvm/nvm.sh" ] && . "$HOME/.nvm/nvm.sh"

          APP_DIR="$1"
          APP_NAME="$2"
          RELEASE="$APP_DIR/releases/$(date +%Y%m%d%H%M%S)"
          CURRENT="$APP_DIR/current"
          PREVIOUS="$(readlink -f "$CURRENT" 2>/dev/null || true)"

          test -f "$APP_DIR/.env.staging"

          mkdir -p "$RELEASE"
          tar -xzf "$APP_DIR/deploy.tar.gz" -C "$RELEASE"
          ln -sfn "$APP_DIR/.env.staging" "$RELEASE/.env"
          cd "$RELEASE" && npm ci --omit=dev --no-audit --no-fund

          start() {
            ln -sfn "$1" "$APP_DIR/current.tmp"
            mv -Tf "$APP_DIR/current.tmp" "$CURRENT"
            pm2 delete "$APP_NAME" >/dev/null 2>&1 || true
            pm2 start "$CURRENT/dist/main.js" --name "$APP_NAME" --cwd "$CURRENT"
            sleep 10
            pm2 describe "$APP_NAME" | grep -q "status.*online"
          }

          if start "$RELEASE"; then
            pm2 save
            rm -f "$APP_DIR/deploy.tar.gz"
            ls -1dt "$APP_DIR"/releases/*/ | tail -n +6 | xargs -r rm -rf
            echo "Deployed: $RELEASE"
          else
            pm2 logs "$APP_NAME" --lines 50 --nostream || true
            [ -d "$PREVIOUS" ] && start "$PREVIOUS" && pm2 save
            rm -rf "$RELEASE"
            exit 1
          fi
          REMOTE

      - name: Cleanup
        if: always()
        run: rm -f /tmp/app.tar.gz ~/.ssh/deploy_key ~/.ssh/config